<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây dựng server + form đăng ký người dùng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .section-title {
            text-align: center;
            color: #10b981;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .divider {
            border-top: 1px dashed #cbd5e1;
            margin-bottom: 2rem;
        }

        .demo-card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .demo-header {
            background-color: #0f172a;
            color: #10b981;
            padding: 1rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .demo-header::before {
            content: '●';
            color: #10b981;
        }
        
        .demo-header span {
            color: #cbd5e1;
        }

        .demo-body {
            padding: 2rem;
        }

        .forms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .forms-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-title {
            color: #10b981;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 0.25rem;
        }

        .form-control {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #334155;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn:hover {
            background-color: #059669;
        }

        .result-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 1rem;
            min-height: 80px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #64748b;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .result-box.success {
            color: #10b981;
            background-color: #ecfdf5;
            border-color: #a7f3d0;
        }

        .result-box.error {
            color: #ef4444;
            background-color: #fef2f2;
            border-color: #fecaca;
        }

        .console-section {
            margin-top: 2rem;
        }

        .console-title {
            color: #64748b;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .console-box {
            background-color: #0f172a;
            color: #3b82f6;
            padding: 1.25rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            min-height: 80px;
            white-space: pre-wrap;
        }


    </style>
</head>
<body>

    <div class="container">
        <div class="section-title">DEMO THỬ NGAY</div>
        <div class="divider"></div>

        <div class="demo-card">
            <div class="demo-header">
                DEMO LIVE <span>— Giả lập API chạy trong trình duyệt</span>
            </div>
            
            <div class="demo-body">
                <div class="forms-grid">
                    <!-- FORM 1 -->
                    <div>
                        <div class="form-title">FORM 1 — GET /api/info</div>
                        <form id="infoForm">
                            <div class="form-group">
                                <label>Tên</label>
                                <input type="text" id="infoName" class="form-control" placeholder="Nhập tên..." required>
                            </div>
                            <div class="form-group">
                                <label>Tuổi</label>
                                <input type="number" id="infoAge" class="form-control" placeholder="Nhập tuổi..." required>
                            </div>
                            <button type="submit" class="btn">Gửi GET /api/info</button>
                        </form>
                        <div id="infoResult" class="result-box">Kết quả hiện ở đây...</div>
                    </div>

                    <!-- FORM 2 -->
                    <div>
                        <div class="form-title">FORM 2 — POST /api/register</div>
                        <form id="registerForm">
                            <div class="form-group">
                                <label>Tên</label>
                                <input type="text" id="regName" class="form-control" placeholder="Nhập tên..." required>
                            </div>
                            <div class="form-group">
                                <label>Tuổi</label>
                                <input type="number" id="regAge" class="form-control" placeholder="Nhập tuổi..." required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="regEmail" class="form-control" placeholder="Nhập email..." required>
                            </div>
                            <button type="submit" class="btn">Gửi POST /api/register</button>
                        </form>
                        <div id="registerResult" class="result-box">Kết quả hiện ở đây...</div>
                    </div>
                </div>

                <div class="console-section">
                    <div class="console-title">CONSOLE LOG — Middleware logger</div>
                    <div id="consoleBox" class="console-box">// Log sẽ hiện ở đây khi bạn gửi request...</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const addLog = (method, path) => {
            const time = new Date().toISOString();
            const logText = `[${time}] ${method} ${path}\n`;
            const consoleBox = document.getElementById('consoleBox');
            if (consoleBox.innerText.includes('// Log sẽ hiện ở đây')) {
                consoleBox.innerText = '';
            }
            consoleBox.innerText += logText;
        };

        const showResult = (elementId, data, isError) => {
            const el = document.getElementById(elementId);
            el.className = 'result-box ' + (isError ? 'error' : 'success');
            el.innerText = JSON.stringify(data, null, 2);
        };

        // FORM 1
        document.getElementById('infoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('infoName').value.trim();
            const age = document.getElementById('infoAge').value.trim();
            
            const params = new URLSearchParams({ name, age });
            const path = `/api/info?${params.toString()}`;
            
            // Hiện log giả lập lên giao diện
            addLog('GET', path);
            
            fetch(path)
                .then(res => res.json().then(data => ({ status: res.status, body: data })))
                .then(({ status, body }) => {
                    showResult('infoResult', body, status !== 200);
                })
                .catch(err => {
                    showResult('infoResult', { error: 'Fetch failed (Server có thể chưa chạy)' }, true);
                });
        });

        // FORM 2
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const age = document.getElementById('regAge').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            
            // Hiện log giả lập lên giao diện
            addLog('POST', '/api/register');
            
            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, age, email })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(({ status, body }) => {
                showResult('registerResult', body, status !== 200);
            })
            .catch(err => {
                showResult('registerResult', { error: 'Fetch failed (Server có thể chưa chạy)' }, true);
            });
        });
    </script>
</body>
</html>
